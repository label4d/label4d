[project]
name = "labelfaster-tools"
version = "0.1.0"
description = "Labelfaster offline data tooling (point cloud stitching, fixtures)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
waymo = ["pyarrow>=25.0.0", "jsonschema>=4.23"]
waymo-reference = ["pyarrow>=25.0.0", "jsonschema>=4.23", "tensorflow>=2.20; python_version < '3.14'"]

[tool.uv]
package = false
